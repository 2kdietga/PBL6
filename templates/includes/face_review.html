<section class="card"><div class="card-header"><h2>Ảnh đại diện và nhận diện khuôn mặt</h2></div><div class="card-body">{% if face %}<img class="upload-preview" src="{{ face.face_image_url }}" alt="Ảnh tài xế" referrerpolicy="no-referrer"><p>{{ face.get_approval_status_display }} · Vector {{ face.embedding|length }} chiều</p><details><summary>Xem vector embedding</summary><pre class="embedding-vector">{{ face.embedding }}</pre></details><form class="form-actions" method="post" action="{% url 'frontend:driver-action' driver.pk %}">{% csrf_token %}<button class="button danger" name="action" value="face-reject">Từ chối khuôn mặt</button><button class="button primary" name="action" value="face-approve">Duyệt khuôn mặt</button></form>{% else %}<p>Chưa bổ sung ảnh khuôn mặt.</p>{% endif %}</div></section>
